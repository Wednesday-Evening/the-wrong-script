<script>
/* THE WRONG SCRIPT — single-file interactive film. Systems: state+save, scene renderer, node table N, intro/title, interludes, endings. */
const $=s=>document.querySelector(s);
let T=[],snd=false,AC,S=fresh(),firstDraw=true;
function fresh(){return{v:{},c:{},f:{},sc:'cast',h:0}}
function save(){try{localStorage.setItem('tws',JSON.stringify(S))}catch(e){}}
/* Reading a save is deliberately forgiving. No version field is required, so every
   save written by any earlier build of this film still loads. Only structurally
   impossible data is refused, and a refused save is copied aside before anything
   can overwrite it, so a player's progress is never thrown away silently. */
let SAVE_CORRUPT=false;
function valid(sv){
 if(!sv||typeof sv!=='object'||Array.isArray(sv))return false;
 if(typeof sv.sc!=='string'||typeof N[sv.sc]!=='function')return false;
 if(!sv.v||typeof sv.v!=='object'||Array.isArray(sv.v))return false;
 if(!sv.c||typeof sv.c!=='object'||Array.isArray(sv.c))return false;
 if(!sv.f||typeof sv.f!=='object'||Array.isArray(sv.f))return false;
 if(typeof sv.h!=='number'||!isFinite(sv.h)||sv.h<0)sv.h=0;
 return true;
}
function load(){
 let raw=null;
 try{raw=localStorage.getItem('tws')}catch(e){return null}
 if(!raw)return null;
 let sv=null;
 try{sv=JSON.parse(raw)}catch(e){sv=null}
 if(valid(sv))return sv;
 SAVE_CORRUPT=true;
 try{if(!localStorage.getItem('tws.corrupt'))localStorage.setItem('tws.corrupt',raw)}catch(e){}
 return null;
}
function blip(f=140){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.4);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4)}catch(e){}}

   hints, toasts) never add an entry. The first draw of a visit replaces instead
   of pushing, so entering the film cannot trap the player in a back-loop. */

 try{const h='#'+S.sc;if(location.hash!==h){
  if(firstDraw){history.replaceState({sc:S.sc},'','#'+S.sc)}

}

 const id=fromHash();
 if(!id){firstDraw=true;title();return}
 if(typeof N[id]!=='function'||id===S.sc)return;
 S.sc=id;S.h=0;draw();
});
/* in-page confirm dialog (browser confirm() can be blocked in embeds) */
const ask=(q,y)=>{$('#mq').textContent=q;$('#md').style.display='flex';$('#my').onclick=()=>{$('#md').style.display='none';y()};$('#mn').onclick=()=>{$('#md').style.display='none'}};

/* crew members: [name, icon, dialogue, credit line] */
const CREW={d:['DOLORES, PROPS','🧰',[['DOLORES','Quills? We never stocked quills. Quills are for people with plots.'],['DOLORES','If anyone asks, the castle fire was a lighting choice.']],'Props: Dolores (denies everything).'],t:['TEO, SOUND','🎧',[['TEO','I’ve recorded the same creak for three films. It’s still the best one.'],['TEO','Switch sound on up top. I’ll try not to ruin it.']],'Sound: Teo (one creak, three films).'],p:['MR. PELL, FACILITIES','🧹',[['MR. PELL','I’ve swept up four genres this week. Horror leaves the most glitter.'],['MR. PELL','Room 13? Don’t ask. I just mop around it.']],'Facilities: Mr. Pell (mops around Room 13).'],b:['BEA, INTERN','📋',[['BEA','My title changes by scene. I was a ghost earlier. Unpaid.'],['BEA','If the script’s blank, you write the ending. I’ll bring snacks.']],'Intern: Bea (currently a ghost).']};

cast:()=>({t:'CASTING ERROR',i:'🎬',g:'radial-gradient(circle at 50% 20%,#4a3a1c,#080808 70%)',l:[D('Wait. You’re not the actress we hired.'),'…',D('Well… you’re here now. We have already spent the budget.'),'A single spotlight. One chair. A curtain far away, breathing slightly.','WHO ARE YOU?'],

hub:()=>{if(nv()>=2&&!S.f.gl){S.f.gl=1;return N.glitch()}
 const r=(k,l,e)=>[(S.v[k]?'✓ ':'')+l,()=>go(e)];
 return{t:'THE DOORS',i:'🚪🚪🚪',g:'linear-gradient(#201010,#080808)',l:['Three doors. Each is labelled in handwriting that keeps getting corrected.',nv()<3?'A fourth door waits, locked, until you’ve seen all three.':'The fourth door is unlocked. A lamp glows behind it.'],
 c:[r('hotel','The Hotel','hotel'),r('studio','The Art Studio','studio'),r('backstage','Backstage','backstage')].concat([['☕ The Crew Lounge'+(crewN()?' ('+crewN()+'/4 met)':''),()=>go('crew')]]).concat(S.f.gl?[['🎞 Replay the genre chaos',()=>go('horror')]]:[]).concat(nv()>=3?[['★ The Editing Room',()=>go('editing')]]:[])}},

 if(S.f.cast==='B')L.push(R('You have the look of someone who sets castles on fire.'));

 if(s.c)L.push('🪟 Curtain: only 2 tassels hang here. Just two.');if(s.k)L.push('🕓 Clock: stopped at 4 o’clock.');if(s.r)L.push('🟥 Carpet: a pattern of 8 diamonds.');

 if(all){L.push('Safe display: 2 — 4 — 8 — ?');[6,12,16,32].forEach(n=>c.push(['Enter '+n,()=>{if(n===16)return go('hsolve');toast({6:'Close, in the way a sock is close to a shoe.',12:'The safe laughs politely. Hotels do that.',32:'Ambitious. The safe is not on that kind of budget.'}[n])}]))}
 return{t:'THE HOTEL',i:'🔐',g:'linear-gradient(#3a2410,#080808)',l:L,c,hint:['Hotels love patterns. This one is not subtle.','Look at the three numbers you found. How do they relate?','Each number is double the last. What is double 8?']}},

studio:()=>{if(S.v.studio)return{...done('THE ART STUDIO','🎨'),l:['The painting has changed again. A tiny figure on it now holds a clipboard.',PAINT[S.f.paint]?'Your '+PAINT[S.f.paint][0]+' is still there. It looks proud.':'']};
 return{t:'THE ART STUDIO',i:'🎨',g:'linear-gradient(#1c2a3a,#080808)',l:[A('You’re late.'),['YOU','Late for what?'],A('That depends. Have you seen the ending?'),'The artist turns a canvas. It shows a scene that looks very much like this film.',S.c.hotel?A('Room 13? Yes. I painted it. It was a mistake. It’s been a mistake ever since.'):''].filter(Boolean),

s2:()=>({t:'THE ART STUDIO',i:'🖼️',g:'linear-gradient(#1c2a3a,#080808)',l:[A('Don’t worry. Paintings are usually harmless.'),A('Usually.'),'A blank canvas waits on a spare easel. The artist nods at it. Add one thing.'],c:[1,2,3].map(k=>[PAINT[k][1]+' Paint '+PAINT[k][0],()=>{S.f.paint=k;go('s3')}])}),

backstage:()=>{if(S.v.backstage)return done('BACKSTAGE','🎭');return{t:'BACKSTAGE',i:'🎭',g:'linear-gradient(#2a1030,#080808)',l:[X('None of this is real.'),X('None of this is real.'),'He notices you in the mirror.',X('Oh. You’re not supposed to be here.'),'WHO SENT YOU?'],
 c:[['THE DIRECTOR',()=>{S.f.who='d';go('bp')}],['NOBODY',()=>{S.f.who='n';go('bp')}],['“I AM BEGINNING TO REGRET THIS ENTIRE EXPERIENCE.”',()=>{S.f.who='r';go('bp')}]]}},
bp:()=>{const L=[X({d:'That explains everything. He’s been making questionable decisions since Tuesday.',n:'That’s either very concerning or very impressive. I haven’t decided.',r:'That’s fair. I regret the entire production too.'}[S.f.who])];
 if(S.c.hotel)L.push(X('You have a hotel key. Don’t ask what’s on the other side of 13. I did, once.'));
 if(S.c.studio)L.push(X('Paint on your sleeve. The artist sent you, didn’t they.'));
 L.push(X('I’ll tell you what I know if you can tell me which prop is missing from my reflection.'),'In the mirror: 👑 🎭. On the prop table: 👑 🎭 🪶.');
 return{t:'BACKSTAGE',i:'🪞',g:'linear-gradient(#2a1030,#080808)',l:L,c:[['👑 The crown',()=>toast('The mirror shows the crown. The actor shrugs.')],['🎭 The mask',()=>toast('Also in the mirror. Look again, gently.')],['🪶 The quill',()=>go('bsolve')]],hint:['Compare the mirror to the table. Calmly.','The mirror has two props. The table has three.','Which prop appears on the table but not in the mirror?']}},

editing:()=>nv()<3?N.hub():({t:'THE EDITING ROOM',i:'🎞️',g:'radial-gradient(circle at 50% 30%,#3a3010,#050505 70%)',l:['Film reels. Monitors. One desk lamp. The director sits alone among unfinished drafts.',['YOU','Where’s the script?'],D('…'),['YOU','You’re the one who lost it?'],D('Technically, it was never written.'),'You lay out your three fragments: “Ominous?”, wet paint saying the story keeps changing genres, and a blank page marked “figure out later.”','Every time they wrote it, the story changed. Horror became comedy. Comedy became action. Action became fantasy. They never finished a single draft.',D('So we thought we’d let you finish it.'),S.f.cast==='B'?D('Please don’t set anything on fire.'):S.f.cast==='C'?D('I know. I’ve seen the casting department.'):D('You did read the script, right? …Right?')],c:[['What now?',()=>go('final')]]}),
final:()=>({t:'THE FINAL CUT',i:'🎞️',g:'radial-gradient(circle at 50% 30%,#3a3010,#050505 70%)',l:['The editing desk. Three options glow on the monitors.'].concat(S.f.paint?['Your '+PAINT[S.f.paint][0]+' glows faintly on one monitor. It wants to be in the film.']:[]).concat(S.f.who==='r'?[X('(from the doorway) Pick the exit. I’m begging.')]:[]).concat(crewN()>=2?['The crew gathers in the doorway, pretending not to listen. Dolores is holding popcorn.']:[]),c:[['REPAIR THE SCRIPT',()=>go('endA')],['THROW IT AWAY AND MAKE A NEW FILM',()=>go('endB')],['LEAVE THE PRODUCTION',()=>go('endC')]]}),
endA:()=>({t:'THE MASTERPIECE',i:'🌅',g:'linear-gradient(#f0a850,#7A171C 70%,#080808)',l:['You write. The reels line up. The colors warm. A sunrise fills the frame, then a curtain call.',D('I knew you could do it.'),'Director: Still recovering.','Screenwriter: Janiz (unwillingly).','Production: Somehow successful.','Cast: One extremely confused protagonist.'].concat(Object.keys(S.f.cm||{}).map(k=>CREW[k][3])).concat(S.f.story?['Special thanks: “'+STORY[S.f.story]+'”']:[]).concat(['THE END.']),c:[['Continue ▸',()=>go('post')]]}),
endB:()=>({t:'THE CHAOS CUT',i:'🎉',g:'linear-gradient(135deg,#7A171C,#B99A62,#1c2a3a,#4a1a2a)',l:['You tear up the script. Frames shuffle. Confetti.','The director becomes the receptionist. The receptionist becomes the villain. The villain becomes a popcorn seller.','Room 13 is now a snack bar.'].concat(S.f.cm&&S.f.cm.b?['Bea the intern is promoted to Director. Then Villain. Then Popcorn.']:[]).concat(S.f.paint?['A '+PAINT[S.f.paint][0]+' appears in every shot for no reason.']:[]).concat(S.f.story?['Bonus scene: “'+STORY[S.f.story]+'”.']:[]).concat([SY('Congratulations.'),SY('You have successfully ruined the original film.'),SY('It is now significantly better.'),'THE END.']),c:[['Continue ▸',()=>go('post')]]}),
endC:()=>({t:'THE EXIT',i:'🚪',g:'linear-gradient(#444,#fff3d6)',l:['A quiet corridor. The red EXIT sign. A door opens onto bright daylight.',D('Wait! You can’t leave! We haven’t filmed the ending!'),D('At least tell me what happens!'),'Some stories don’t need an ending.','Some productions simply need better management.','THE END.'],c:[['Continue ▸',()=>go('post')]]}),
post:()=>({t:'',i:'',g:'#000',l:['WAIT.','We found your original script.'],c:[['OPEN IT',()=>go('post2')]]}),
post2:()=>({t:'',i:'',g:'#000',l:['The original script was blank.','It still is.','Anyway, thanks for funding this production with your attention.'],c:[['REPLAY THE FILM',()=>{S=fresh();go('cast')}],['RETURN TO OPENING',()=>{S=fresh();save();intro()}]]})
};

/* Renderer */
function draw(){T.forEach(clearTimeout);T=[];const n=N[S.sc](),st=$('#stage'),w=S.sc.startsWith('post');
 st.innerHTML=`${n.i?`<div class="art" style="background:${n.g||'#111'}" aria-hidden="true">${n.i}</div>`:''}${n.t?`<h2 class="serif">${n.t}</h2>`:''}<div id="ls"></div><div id="ch"></div>`;
 n.l.forEach((x,i)=>{const d=document.createElement('p');d.className='ln'+(n.m?' mono':'');d.style.animationDelay=i*.55+'s';
  if(Array.isArray(x)){const b=document.createElement('b');b.textContent=x[0]+' ';d.append(b,x[1])}else{d.textContent=x;d.classList.add('nar')}$('#ls').append(d)});
 const dl=n.l.length*.55+.1;
 (n.c||[]).forEach(([lab,fn])=>{const b=document.createElement('button');b.className='ln';b.style.animationDelay=dl+'s';b.textContent=lab;b.onclick=()=>{blip();fn()};$('#ch').append(b)});
 if(n.hint){const b=document.createElement('button');b.className='ghost ln';b.style.animationDelay=dl+'s';b.textContent='💡 Hint';b.onclick=()=>toast(n.hint[Math.min(S.h++,n.hint.length-1)]);$('#ch').append(b)}
 const k=nv();$('#reel').textContent='🎞 '+'●'.repeat(k)+'○'.repeat(3-k);save();syncHash();blip(110);window.scrollTo(0,0)}

/* Intro + title */
function intro(){T.forEach(clearTimeout);T=[];$('#bar').hidden=true;
 const B=['Some stories are carefully written.','A beginning. A middle. An ending.','Some have a cast, a crew, and a director who knows what they’re doing.','…This one had none of those things.'];
 $('#stage').innerHTML='<div id="beat" class="beat serif" aria-live="polite"></div><button class="ghost" id="skp">SKIP INTRO</button>';
 $('#skp').onclick=title;const e=$('#beat');let i=0;
 (function nx(){if(i>=B.length)return T.push(setTimeout(title,600));e.textContent=B[i++];e.style.opacity=1;T.push(setTimeout(()=>{e.style.opacity=0;T.push(setTimeout(nx,1100))},2900))})()}
function title(){T.forEach(clearTimeout);T=[];$('#bar').hidden=true;const sv=load(),has=!!sv&&!sv.sc.startsWith('post')&&Object.keys(sv.f||{}).length>0;
 $('#stage').innerHTML=`<h1 class="serif flick">THE WRONG SCRIPT</h1><p class="c nar">“She wasn’t supposed to be here.”</p><p class="c mono" style="font-size:13px;color:var(--gold)">An interactive motion picture</p>
 <div class="slate mono"><div><span>Production status</span><span>Already falling apart</span></div><div><span>Director</span><span>Questionable competence</span></div><div><span>Runtime</span><span>Classified</span></div><div><span>Cast</span><span>One confused lead</span></div><div><span>Script</span><span>Missing</span></div></div>
 <button class="main" id="go">ENTER THE FILM</button><p class="c mono" style="font-size:13px">Proceed at your own questionable discretion.</p>${has?'<button id="cont">CONTINUE (saved)</button>':''}${SAVE_CORRUPT?'<p class="c mono" style="font-size:12px;color:#B99A62;max-width:38ch">A saved film was found in this browser, but its data could not be read. It has been set aside rather than erased, so starting a new film will not destroy it.</p>':''}`;
 const fx=cb=>{const f=$('#flare');f.style.animation='flare .7s';blip(90);setTimeout(()=>{f.style.animation='';$('#bar').hidden=false;cb()},380)};
 $('#go').onclick=()=>{const st=()=>{S=fresh();fx(()=>go('cast'))};has?ask('Start a new film? Your saved progress will be replaced.',st):st()};
 if(has)$('#cont').onclick=()=>{S=sv;fx(draw)}}

/* Controls */
$('#snd').onclick=e=>{snd=!snd;e.target.textContent='Sound: '+(snd?'on':'off');e.target.setAttribute('aria-pressed',snd);blip(180)};
$('#calm').onclick=e=>{const c=document.body.classList.toggle('calm');e.target.setAttribute('aria-pressed',c);e.target.textContent=c?'Calm ✓':'Calm'};
$('#new').onclick=()=>ask('Start over? Current progress will be erased.',()=>{S=fresh();try{localStorage.removeItem('tws')}catch(e){}intro()});
if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.body.classList.add('calm');$('#calm').textContent='Calm ✓';$('#calm').setAttribute('aria-pressed',true)}
/* tap anywhere (not on a button) to reveal all lines at once */
$('#stage').addEventListener('click',e=>{if(e.target.closest('button'))return;document.querySelectorAll('.ln').forEach(x=>{x.style.animation='none';x.style.opacity=1})});
/* a stale scene hash from a previous visit must not skip the title card */
if(location.hash)try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
intro();
</script></body></html>
